<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Elimu Ya Dini</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================================================
     HTML: ORODHA YA MASOMO
     ============================================================ -->
<div id="lessonList">
  <div class="topbar"><h1 id="pageTitle">📚 Masomo</h1><span id="count" class="count"></span></div>
  <div class="search-wrap">
    <input id="searchInput" type="search" placeholder="🔎 Tafuta somo..." autocomplete="off" />
    <button id="clearSearch" aria-label="Futa utafutaji">×</button>
  </div>
  <div id="categories" class="categories"></div>
  <div id="backCatBox"></div>
  <div id="loadingMsg">Inapakia masomo...</div>
  <div id="listContainer"></div>
  <div id="emptyMsg" class="hidden">Hakuna somo lililopatikana.</div>
</div>

<!-- ============================================================
     HTML: VIEW YA SOMO
     ============================================================ -->
<div id="lessonView">
  <div class="reader-head"><h2 id="lessonTitle"></h2></div>
  <img id="lessonImage" src="" alt="Picha ya somo" />
  <div id="lessonMeta" class="reader-meta"></div>
  <div id="lessonContent"></div>
</div>

<!-- ============================================================
     HTML: MATCH BAR
     ============================================================ -->
<div id="matchBar" class="hidden">
  <button id="prevM" aria-label="Iliyotangulia">▲</button>
  <span id="matchInfo"></span>
  <button id="nextM" aria-label="Inayofuata">▼</button>
</div>

<script src="app.js"></script>
</body>
</html>
