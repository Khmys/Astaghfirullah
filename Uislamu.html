<div id="lessonList">
  <div class="topbar">
    <h1>📚 Masomo</h1>

  <div class="search-wrap">

  <div class="reader-head"><h2 id="lessonTitle"></h2></div>

  <div id="lessonContent"></div>
</div>

  <button id="prevM" aria-label="Iliyotangulia">▲</button>

<script>
"use strict";

const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.enableClosingConfirmation();
}

const listContainer = document.getElementById("listContainer");
const loadingMsg = document.getElementById("loadingMsg");
const emptyMsg = document.getElementById("emptyMsg");
const searchInput = document.getElementById("searchInput");
const clearSearch = document.getElementById("clearSearch");
const categoriesBox = document.getElementById("categories");
const count = document.getElementById("count");

let masomo = [];
let categoryActive = "Zote";
let marks = [];
let curMark = -1;

const MARKS = /[\u0300-\u036f\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g;
const AR_FIX = { "ٱ":"ا", "ى":"ي", "ة":"ه" };

function normChar(c) {
  return c.normalize("NFD").replace(MARKS, "").toLowerCase()
    .replace(/[’‘'`\-–—]/g, "")
    .replace(/[ٱىة]/g, m => AR_FIX[m]);
}

function normMap(t) {
  t = String(t == null ? "" : t);
  let out = "";
  const map = [];

  for (let i = 0; i < t.length; i++) {
    for (const ch of normChar(t[i])) {
      if ("aeiou".includes(ch) && out.endsWith(ch)) continue;
      out += ch;
      for (let k = 0; k < ch.length; k++) map.push(i);
    }
  }
  return { out, map };
}

const norm = t => normMap(t).out;
function queryWords() {
  return norm(searchInput.value).split(/\s+/).filter(Boolean);
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>'"]/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;"
  }[c]));
}
function escapeAttr(value) { return escapeHtml(value); }

function maandishiYote(v, acc = []) {
  if (typeof v === "string") {
    if (v.trim()) acc.push(v);
  } else if (Array.isArray(v)) {
    v.forEach(x => maandishiYote(x, acc));
  } else if (v && typeof v === "object") {
    Object.values(v).forEach(x => maandishiYote(x, acc));
  }
  return acc;
}

/* Pakia orodha ya masomo */
async function pakiaMasomo() {
  try {
    const res = await fetch("masomo.json");
    if (!res.ok) throw new Error("Imeshindwa kupakia masomo.json");

    const data = await res.json();
    masomo = Array.isArray(data) ? data : (data.masomo || []);

    loadingMsg.classList.add("hidden");
    tengenezaCategories();
    choraOrodha();
    jengaIndex();
  } catch (error) {
    console.error(error);
    loadingMsg.textContent = "Samahani, imeshindwa kupakia masomo. Jaribu tena baadaye.";
  }
}

function tengenezaCategories() {
  const categories = ["Zote", ...new Set(masomo.map(s => s.category || "Mengineyo"))];

  categoriesBox.innerHTML = categories.map(cat => `
    <button class="cat-btn ${cat === categoryActive ? "active" : ""}"
      data-category="${escapeAttr(cat)}">${escapeHtml(cat)}</button>
  `).join("");

  categoriesBox.querySelectorAll(".cat-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      categoryActive = btn.dataset.category;
      tengenezaCategories();
      choraOrodha();
    });
  });
}

/* Index ya kutafuta ndani ya mafaili */
let indexPending = 0;

function jengaIndex() {
  masomo.forEach(somo => {
    if (!somo.file || somo._index) return;

    indexPending++;
    fetch(somo.file)
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (!data) return;
        somo._segs = maandishiYote(data).map(t => ({ t, n: norm(t) }));
        somo._index = somo._segs.map(x => x.n).join(" \n ");
      })
      .catch(err => console.warn("Index haikupakiwa:", somo.file, err))
      .finally(() => {
        indexPending--;
        if (searchInput.value.trim()) choraOrodha();
      });
  });
}

function highlightIn(root, words) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);

  nodes.forEach(node => {
    const text = node.nodeValue;
    const { out, map } = normMap(text);
    const ranges = [];

    words.forEach(w => {
      let i = out.indexOf(w);
      while (i !== -1) {
        const end = map[i + w.length - 1] + 1;
        ranges.push([map[i], end]);
        i = out.indexOf(w, i + w.length);
      }
    });

    if (!ranges.length) return;
    ranges.sort((a,b) => a[0] - b[0]);

    const merged = [ranges[0].slice()];
    for (const r of ranges.slice(1)) {
      const last = merged[merged.length - 1];
      if (r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
      else merged.push(r.slice());
    }

    const frag = document.createDocumentFragment();
    let pos = 0;

    merged.forEach(([start,end]) => {
      if (start > pos) frag.appendChild(document.createTextNode(text.slice(pos,start)));
      const mark = document.createElement("mark");
      mark.textContent = text.slice(start,end);
      frag.appendChild(mark);
      pos = end;
    });

    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    node.replaceWith(frag);
  });
}

function snippetFor(somo, words) {
  const segs = somo._segs || [];
  const seg = segs.find(x => words.every(w => x.n.includes(w)))
    || segs.find(x => words.some(w => x.n.includes(w)));

  if (!seg) return "";

  const { out, map } = normMap(seg.t);
  const w = words.find(word => out.includes(word));
  if (!w) return "";

  const p = out.indexOf(w);
  const startIndex = Math.max(0, p - 45);
  const endIndex = Math.min(map.length - 1, p + 110);
  const start = map[startIndex] ?? 0;
  const end = (map[endIndex] ?? seg.t.length - 1) + 1;

  return (start > 0 ? "… " : "") + seg.t.slice(start,end).trim()
    + (end < seg.t.length ? " …" : "");
}

function choraOrodha() {
  const words = queryWords();

  const filtered = masomo.filter(somo => {
    const category = somo.category || "Mengineyo";
    const matchesCategory = categoryActive === "Zote" || category === categoryActive;
    const haystack = norm(
      `${somo.title || ""} ${somo.subtitle || ""} ${typeof somo.content === "string" ? somo.content : ""} ${category}`
    ) + " " + (somo._index || "");

    return matchesCategory && words.every(w => haystack.includes(w));
  });

  listContainer.innerHTML = "";
  count.textContent = `${filtered.length}/${masomo.length}`;
  emptyMsg.textContent = words.length && indexPending > 0
    ? "Inatafuta ndani ya masomo..." : "Hakuna somo lililopatikana.";
  emptyMsg.classList.toggle("hidden", filtered.length !== 0);

  filtered.forEach(somo => {
    const item = document.createElement("div");
    item.className = "lesson-item";

    const image = somo.image || "";
    item.innerHTML = `
      <img src="${escapeAttr(image)}" alt="" loading="lazy"
        class="${image ? "" : "hidden"}">
      <div class="info">
        <div class="title">${escapeHtml(somo.title || "Bila jina")}</div>
        <div class="subtitle">${escapeHtml(somo.subtitle || "")}</div>
        <span class="category-label">${escapeHtml(somo.category || "Mengineyo")}</span>
      </div>
      <span class="arrow">›</span>`;

    if (words.length) {
      const snippet = snippetFor(somo, words);
      if (snippet) {
        const d = document.createElement("div");
        d.className = "snippet";
        d.dir = "auto";
        d.textContent = snippet;
        highlightIn(d, words);
        item.querySelector(".info").appendChild(d);
      }
    }

    item.addEventListener("click", () => funguaSomo(somo));
    listContainer.appendChild(item);
  });
}

/* Utafutaji ndani ya somo lililofunguliwa */
function onyeshaMatches() {
  const words = queryWords();
  const bar = document.getElementById("matchBar");
  const content = document.getElementById("lessonContent");

  marks = [];
  curMark = -1;

  if (words.length) {
    highlightIn(content, words);
    marks = [...content.querySelectorAll("mark")];
  }

  bar.classList.toggle("hidden", marks.length === 0);
  if (marks.length) ruka(0);
}

function ruka(i) {
  if (!marks.length) return;

  if (marks[curMark]) marks[curMark].classList.remove("cur");
  curMark = (i + marks.length) % marks.length;
  marks[curMark].classList.add("cur");
  marks[curMark].scrollIntoView({ block:"center", behavior:"smooth" });

  document.getElementById("matchInfo").textContent = `${curMark + 1}/${marks.length}`;
}

/* Fungua somo */
async function funguaSomo(somo) {
  const lessonImage = document.getElementById("lessonImage");
  const lessonContent = document.getElementById("lessonContent");
  const lessonView = document.getElementById("lessonView");

  document.getElementById("lessonTitle").textContent = somo.title || "";
  document.getElementById("lessonMeta").textContent = somo.subtitle || somo.category || "";

  lessonImage.src = somo.image || "";
  lessonImage.classList.toggle("hidden", !somo.image);

  lessonContent.innerHTML = '<p class="content-body">Inapakia...</p>';
  document.getElementById("lessonList").classList.add("hidden");
  lessonView.style.display = "block";

  if (tg) tg.BackButton.show();
  window.scrollTo(0,0);

  let content = somo.content || "";

  if (somo.file) {
    try {
      const res = await fetch(somo.file);
      if (!res.ok) throw new Error("Imeshindwa kupakia " + somo.file);
      const data = await res.json();

      // Sura na hadithi huhitaji object nzima.
      if (data.type === "sura" || data.type === "hadiyth" || data.type === "lesson") {
        content = data.type === "lesson" ? data.content : data;
      } else if (!content) {
        content = data.content || data;
      }
    } catch (error) {
      console.error(error);
      lessonContent.innerHTML = '<p class="content-body">Samahani, imeshindwa kupakia somo hili.</p>';
      return;
    }
  }

  const isQuran = content && content.type === "sura";
  const isHadith = content && content.type === "hadiyth";

  lessonImage.classList.toggle("hidden", !somo.image || isQuran);
  lessonView.classList.toggle("hadiyth-reader", !!isHadith);
  lessonView.classList.toggle("quran-reader", !!isQuran);

  if (isHadith) {
    lessonContent.innerHTML = pangaHadiyth(content);
  } else if (isQuran) {
    lessonContent.innerHTML = pangaSura(content);
  } else if (Array.isArray(content)) {
    lessonContent.innerHTML = pangaKitu(content);
  } else if (content && typeof content === "object") {
    lessonContent.innerHTML = pangaKitu(content);
  } else {
    lessonContent.innerHTML = pangaRangiYaContent(String(content || ""));
  }

  onyeshaMatches();
}

/* Qur'ani */
function pangaSura(sura) {
  const ayahList = Array.isArray(sura.content) ? sura.content : [];
  const pages = [...new Set(ayahList.map(ayah => ayah.page || 1))]
    .sort((a,b) => a-b);

  const pageHtml = pages.map(page => {
    const ayat = ayahList.filter(ayah => (ayah.page || 1) === page);

    const title = page === pages[0] ? `
      <div class="quran-title-row">
        <div class="quran-title-sw">SURA YA ${escapeHtml(sura.name || "").toUpperCase()}</div>
        <div class="quran-title-ar">${escapeHtml(sura.arabic_name || "")}</div>
      </div>
      ${sura.intro ? `<p class="quran-intro">${escapeHtml(sura.intro)}</p>` : ""}
    ` : "";

    return `
      <section class="quran-page">
        <div class="quran-page-header">
          <span>${escapeHtml(sura.surah_number || "")} - ${escapeHtml(sura.name || "")}</span>
          <span>Juzuu ${escapeHtml(sura.juz || 1)}</span>
          <span class="quran-page-number">${escapeHtml(page)}</span>
          <span dir="rtl">الجزء ${escapeHtml(sura.juz || 1)}</span>
          <span>${escapeHtml(sura.arabic_name || "")}</span>
        </div>
        ${title}
        ${ayat.map(ayah => `
          <div class="quran-ayah-row">
            <div class="quran-translation" data-number="${escapeAttr(ayah.number ?? "")}">
              ${escapeHtml(ayah.translation || "")}
            </div>
            <div class="quran-arabic-cell">
              <span class="quran-arabic-number">${escapeHtml(ayah.number ?? "")}</span>
              <span class="quran-arabic-text">${escapeHtml(ayah.arabic || "")}</span>
            </div>
          </div>
        `).join("")}
      </section>`;
  }).join("");

  return `<div class="quran-pages">${pageHtml}</div>`;
}

function pangaAya(ayahList) {
  return ayahList.map(ayah => `
    <div class="ayah-block">
      <div class="ayah-number">Aya ${escapeHtml(ayah.number ?? "")}</div>
      <p class="ayah-arabic">${escapeHtml(ayah.arabic || "")}</p>
      <p class="ayah-translation">${escapeHtml(ayah.translation || "")}</p>
    </div>
  `).join("");
}

/* Kurudi kwenye orodha */
function rudiOrodhani() {
  document.getElementById("lessonView").style.display = "none";
  document.getElementById("matchBar").classList.add("hidden");
  document.getElementById("lessonList").classList.remove("hidden");

  document.getElementById("lessonView").classList.remove("quran-reader","hadiyth-reader");

  if (tg) tg.BackButton.hide();
  window.scrollTo(0,0);
}

/* Maandishi ya kawaida na vichwa */
function pangaRangiYaContent(text) {
  return String(text).split("\n").map(line => {
    const s = line.trim();
    if (!s) return "";

    if (s.startsWith(">")) {
      return `<p class="content-quote">${escapeHtml(s.substring(1).trim())}</p>`;
    }

    const isHeading = s === s.toUpperCase() && /[A-Z]/.test(s);
    return isHeading
      ? `<p class="content-heading">${escapeHtml(s)}</p>`
      : `<p class="content-body">${escapeHtml(s)}</p>`;
  }).join("");
}

/* Kazi ya kuonyesha aina mbalimbali za JSON */
function pangaKitu(v, key = "") {
  if (v == null) return "";

  if (typeof v === "string") {
    if (["kwaarabu","arabic","arabic_name"].includes(key)) {
      return `<p class="ayah-arabic">${escapeHtml(v)}</p>`;
    }
    if (["hadiyth","hadith"].includes(key)) {
      return `<p class="content-quote hadith">${escapeHtml(v)}</p>`;
    }
    if (["tafsiri","translation"].includes(key)) {
      return `<p class="tafsiri">${escapeHtml(v)}</p>`;
    }
    if (["maelezo_ya_wanachuoni","explanation"].includes(key)) {
      return `<p class="content-quote">${escapeHtml(v)}</p>`;
    }
    return pangaRangiYaContent(v);
  }

  if (Array.isArray(v)) {
    return v.map(item => pangaKitu(item, key)).join("");
  }

  if (typeof v === "object") {
    let html = "";

    switch (v.type) {
      case "heading": {
        const heading = v.text || v.title || v.heading || v.content || "";
        return `<h3 class="content-heading">${escapeHtml(heading)}</h3>`;
      }

      case "paragraph": {
        const paragraph = v.text || v.content || v.paragraph || v.translation || "";
        return `<p class="content-body">${escapeHtml(paragraph)}</p>`;
      }

      case "quran": {
        const arabic = v.arabic || v.kwaarabu || "";
        const translation = v.translation || v.tafsiri || v.text || "";
        const reference = v.reference || v.ref || v.surah || "";

        return `
          <div class="ayah-block">
            ${reference ? `<div class="ayah-number">${escapeHtml(reference)}</div>` : ""}
            ${arabic ? `<p class="ayah-arabic">${escapeHtml(arabic)}</p>` : ""}
            ${translation ? `<p class="ayah-translation">${escapeHtml(translation)}</p>` : ""}
          </div>`;
      }

      case "hadith": {
        const arabic = v.arabic || v.kwaarabu || "";
        const translation = v.text || v.translation || v.tafsiri || "";
        const source = v.source || v.chanzo || "";

        return `
          <div class="content-quote hadith">
            ${arabic ? `<p class="ayah-arabic">${escapeHtml(arabic)}</p>` : ""}
            ${translation ? `<p>${escapeHtml(translation)}</p>` : ""}
            ${source ? `<p><i>${escapeHtml(source)}</i></p>` : ""}
          </div>`;
      }

      case "list": {
        const items = v.items || v.list || v.content || [];
        const listItems = Array.isArray(items) ? items : [items];

        return `
          <ul class="content-body">
            ${listItems.map(item => {
              const value = typeof item === "string"
                ? item
                : (item.text || item.title || item.name || "");
              return `<li>${escapeHtml(value)}</li>`;
            }).join("")}
          </ul>`;
      }

      case "books": {
        const books = v.books || v.items || v.content || [];
        const bookList = Array.isArray(books) ? books : [books];

        return `
          <div class="books-list">
            ${bookList.map(book => {
              if (!book || typeof book !== "object") {
                return `<div class="book-item"><div class="book-info"><p>${escapeHtml(book)}</p></div></div>`;
              }

              const title = book.title || book.name || "";
              const author = book.author || book.writer || "";
              const description = book.description || book.text || "";
              const image = book.image || book.image_url || "";

              return `
                <div class="book-item">
                  ${image ? `<img src="${escapeAttr(image)}" alt="${escapeAttr(title)}" loading="lazy">` : ""}
                  <div class="book-info">
                    ${title ? `<h3>${escapeHtml(title)}</h3>` : ""}
                    ${author ? `<p><b>Mwandishi:</b> ${escapeHtml(author)}</p>` : ""}
                    ${description ? `<p>${escapeHtml(description)}</p>` : ""}
                  </div>
                </div>`;
            }).join("")}
          </div>`;
      }
    }

    // Muundo wa zamani wa JSON
    if (v.kichwa) {
      html += `<p class="content-heading">${escapeHtml(v.kichwa)}</p>`;
    }

    if (v.sura && v.kwaarabu) {
      html += `<div class="ayah-number">${escapeHtml(v.sura)}</div>`;
    }

    for (const [k,val] of Object.entries(v)) {
      if (["type","kichwa","sura"].includes(k)) continue;
      html += pangaKitu(val,k);
    }

    return html;
  }

  return `<p class="content-body">${escapeHtml(v)}</p>`;
}

/* Alama za maandishi ya Hadithi */
function alama(t) {
  return escapeHtml(t || "")
    .replace(/\[\[(.+?)\]\]/g, '<span class="aya-red">$1</span>')
    .replace(/\{\{(.+?)\}\}/g, "<i>$1</i>");
}

/* Muundo maalumu wa Hadithi */
function pangaHadiyth(d) {
  const head = `
    <div class="hd-head">
      <div class="ar">${escapeHtml(d.kitabu_ar || "")}</div>
      <div class="sw">${escapeHtml(d.kitabu || "")}</div>
      <div class="ar">${escapeHtml(d.sura_ar || "")}</div>
      <div class="sw">${escapeHtml(d.sura || "")}</div>
    </div>`;

  const items = (d.hadiyth || []).map(h => `
    <div class="hd-item">
      ${[].concat(h.kwaarabu || []).map(a => `<p class="hd-ar">${alama(a)}</p>`).join("")}
      <p class="hd-sw">
        <span class="msimulizi">${escapeHtml(h.msimulizi || "")}</span>
        ${alama(h.tafsiri || "")}
        ${h.chanzo ? `<span class="chanzo">[${escapeHtml(h.chanzo)}]</span>` : ""}
      </p>
      ${[].concat(h.zaidi || []).map(z => `<p class="hd-sw">${alama(z)}</p>`).join("")}
      ${(h.ufafanuzi && h.ufafanuzi.length)
        ? `<p class="hd-ufa-title">UFAFANUZI</p>` +
          [].concat(h.ufafanuzi).map(u => `<p class="hd-ufa">${alama(u)}</p>`).join("")
        : ""}
    </div>
  `).join("");

  return head + items;
}

/* Vitufe na matukio */
searchInput.addEventListener("input", () => {
  clearSearch.style.display = searchInput.value ? "block" : "none";
  choraOrodha();

  if (document.getElementById("lessonView").style.display === "block") {
    // Rudisha alama kwenye maudhui kabla ya kutafuta upya
    funguaMatchesUpya();
  }
});

function funguaMatchesUpya() {
  const content = document.getElementById("lessonContent");
  const marksOld = content.querySelectorAll("mark");
  marksOld.forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  content.normalize();
  onyeshaMatches();
}

clearSearch.addEventListener("click", () => {
  searchInput.value = "";
  clearSearch.style.display = "none";
  choraOrodha();
  if (document.getElementById("lessonView").style.display === "block") {
    funguaMatchesUpya();
  }
  searchInput.focus();
});

document.getElementById("prevM").addEventListener("click", () => ruka(curMark - 1));
document.getElementById("nextM").addEventListener("click", () => ruka(curMark + 1));

if (tg) {
  tg.BackButton.onClick(rudiOrodhani);
}

pakiwa = pakiaMasomo;
pakiwa();
