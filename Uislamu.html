<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Elimu Ya Dini</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --radius: 14px; }
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", "Noto Serif", serif;
    margin: 0; padding: 16px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
  }
  button, input { font: inherit; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
  h1 { font-size:22px; margin:0; }
  .count { font-size:12px; opacity:.65; }
  .search-wrap { position:relative; margin-bottom:12px; }
  #searchInput {
    width:100%; padding:13px 42px 13px 14px; border:0; outline:0;
    border-radius:13px; background:var(--tg-theme-secondary-bg-color,#f1f1f1);
    color:var(--tg-theme-text-color,#000);
  }
  #clearSearch { position:absolute; right:7px; top:5px; border:0; background:transparent; color:var(--tg-theme-hint-color,#777); font-size:22px; display:none; }
  .categories { display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none; }
  .categories::-webkit-scrollbar { display:none; }
  .cat-btn { white-space:nowrap; border:0; border-radius:999px; padding:8px 13px; background:var(--tg-theme-secondary-bg-color,#f1f1f1); color:var(--tg-theme-text-color,#000); }
  .cat-btn.active { background:var(--tg-theme-button-color,#2481cc); color:var(--tg-theme-button-text-color,#fff); }
  .lesson-item { background:var(--tg-theme-secondary-bg-color,#f0f0f0); padding:12px; border-radius:var(--radius); margin-bottom:10px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .lesson-item:active { opacity:.75; }
  .lesson-item img { width:58px; height:58px; border-radius:11px; object-fit:cover; flex:none; }
  .info { flex:1; min-width:0; }
  .title { font-weight:650; font-size:15px; line-height:1.35; }
  .subtitle { font-size:13px; color:var(--tg-theme-hint-color,#777); margin-top:4px; line-height:1.35; }
  .category-label { display:inline-block; font-size:11px; margin-top:7px; opacity:.75; }
  .arrow { opacity:.45; font-size:20px; }
  #lessonView { display:none; }
  .reader-head { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .reader-head h2 { font-size:20px; margin:0; line-height:1.35; }
  #lessonView img { width:100%; max-height:220px; object-fit:cover; border-radius:var(--radius); margin-bottom:14px; }
  .reader-meta { color:var(--tg-theme-hint-color,#777); font-size:13px; margin:-5px 0 15px; }
  .content-heading { color:var(--tg-theme-link-color,#2481cc); font-weight:750; font-size:16px; margin:20px 0 7px; }
  .content-body { color:var(--tg-theme-text-color,#000); font-size:15px; line-height:1.72; margin:0 0 10px; }
  .content-quote { background:var(--tg-theme-secondary-bg-color,#f0f4f8); border-left:4px solid var(--tg-theme-button-color,#2481cc); padding:12px 14px; margin:12px 0; border-radius:8px; font-style:italic; font-size:15px; line-height:1.75; color:var(--tg-theme-text-color,#000); unicode-bidi:plaintext; }
  #emptyMsg, #loadingMsg { text-align:center; color:var(--tg-theme-hint-color,#777); padding:28px 10px; }
  .ayah-block { margin:0 0 22px; padding-bottom:16px; border-bottom:1px solid var(--tg-theme-secondary-bg-color,#eee); }
  .ayah-number { font-size:12px; color:var(--tg-theme-link-color,#2481cc); font-weight:650; margin-bottom:8px; }
  .ayah-arabic { direction:rtl; text-align:right; font-size:24px; line-height:2; color:var(--tg-theme-text-color,#000); margin:0 0 10px; unicode-bidi:plaintext; }
  .ayah-translation { font-size:15px; line-height:1.7; color:var(--tg-theme-hint-color,#666); margin:0; }
  /* Muonekano wa kurasa za Qur'ani: tafsiri kushoto, maandishi ya Kiarabu kulia. */
  .quran-pages { display:flex; flex-direction:column; gap:18px; }
  .quran-reader .reader-head,.quran-reader .reader-meta { display:none; }
  .quran-page { width:100%; max-width:900px; margin:0 auto; padding:18px 16px 22px; background:var(--tg-theme-bg-color,#fff); border:1px solid var(--tg-theme-secondary-bg-color,#d8d8d8); box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .quran-page-header { display:grid; grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr); align-items:center; gap:8px; padding:0 2px 7px; margin-bottom:12px; border-bottom:1px solid var(--tg-theme-hint-color,#888); font-size:11px; font-weight:650; }
  .quran-page-header span:last-child { text-align:right; direction:rtl; }
  .quran-page-header span:last-child { text-align:right; direction:rtl; }
  .quran-page-number { min-width:34px; padding:2px 10px; text-align:center; border:1px solid var(--tg-theme-hint-color,#999); border-radius:0 0 12px 12px; }
  .quran-title-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 12px; }
  .quran-title-sw,.quran-title-ar { min-height:46px; display:flex; justify-content:center; align-items:center; padding:8px; text-align:center; background:var(--tg-theme-secondary-bg-color,#e8f6fb); border:1px solid var(--tg-theme-button-color,#74bfd3); font-size:14px; font-weight:750; }
  .quran-title-ar { direction:rtl; font-size:18px; }
  .quran-intro { margin:12px 0 18px; text-align:center; font-size:13px; line-height:1.55; }
  .quran-ayah-row { display:grid; grid-template-columns:minmax(0, 62%) minmax(0, 38%); align-items:stretch; margin:0; }
  .quran-translation { position:relative; padding:2px 10px 15px 2.9em; font-size:13px; line-height:1.48; white-space:pre-wrap; overflow-wrap:anywhere; }
  .quran-translation:before { content:attr(data-number) "."; position:absolute; top:1px; left:2px; white-space:nowrap; color:var(--tg-theme-link-color,#2498b9); font-weight:700; }
  .quran-arabic-cell { min-width:0; padding:2px 3px 15px 9px; border-left:1px solid var(--tg-theme-hint-color,#aaa); text-align:right; direction:rtl; }
  .quran-arabic-text { font-family:"Noto Naskh Arabic","Amiri","Scheherazade New",serif; font-size:17px; line-height:2.1; overflow-wrap:anywhere; }
  .quran-arabic-number { display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; margin-left:4px; border:1px solid var(--tg-theme-button-color,#77c8dc); border-radius:50%; color:var(--tg-theme-link-color,#2498b9); font-family:serif; font-size:10px; vertical-align:middle; }
  @media (min-width:600px) { .quran-page { padding:24px 26px 28px; } .quran-translation { font-size:15px; line-height:1.58; } .quran-arabic-text { font-size:22px; } }
  .hidden { display:none !important; }
  button, input, textarea { font-family: inherit; }
  .ayah-arabic { color:#d32f2f !important; font-family:"Noto Naskh Arabic","Amiri","Scheherazade New",serif; }
  .tafsiri { color:#2e7d32; font-size:15px; line-height:1.7; margin:0 0 12px; }
  .content-quote.hadith { color:#1565c0; border-left-color:#1565c0; font-style:normal; }
  .hadiyth-reader { background:#c6cdb8; border-radius:10px; padding:12px; color:#222; }
  .hadiyth-reader .reader-head h2, .hadiyth-reader .reader-meta { color:#222; }
  .hd-head { text-align:center; margin:6px 0 18px; font-weight:700; }
  .hd-head .ar { direction:rtl; font-size:26px; color:#0000ee; font-family:"Noto Naskh Arabic","Amiri","Scheherazade New",serif; }
  .hd-head .sw { font-size:18px; color:#222; margin-bottom:8px; }
  .hd-item { margin:0 0 34px; }
  .hd-ar { direction:rtl; text-align:right; color:#0000ee; font-size:22px; line-height:2; margin:0 0 14px; font-family:"Noto Naskh Arabic","Amiri","Scheherazade New",serif; }
  .hd-sw { color:#222; font-size:16px; line-height:1.7; margin:0 0 14px; }
  .hd-sw .msimulizi { color:#0000ee; }
  .hd-sw .chanzo { font-style:italic; }
  .aya-red { color:#e00000; font-weight:700; }
  .hd-ufa-title { text-align:center; text-decoration:underline; font-weight:700; margin:16px 0 8px; }
  .hd-ufa { font-weight:700; font-style:italic; color:#333; line-height:1.7; margin:0 0 10px; }
  /* Vipengele vya somo la jumla (blocks) */
  .content-note { background:var(--tg-theme-secondary-bg-color,#fff8e1); border-left:4px solid #f9a825; padding:11px 14px; margin:12px 0; border-radius:8px; font-size:15px; line-height:1.7; }
  /* Blocks na backgrounds: Qarabic, Marabic, etc */
  .block-qarabic { background:#e8f5e9; padding:14px 14px; margin:12px 0; border-radius:12px; }
  .qarabic-text { direction:rtl; text-align:right; font-size:22px; line-height:2; color:#d32f2f; margin:0 0 10px; font-family:"Noto Naskh Arabic","Amiri","Scheherazade New",serif; }
  
  .block-marabic { background:#e3f2fd; padding:14px 14px; margin:12px 0; border-radius:12px; }
  .marabic-text { direction:rtl; text-align:right; font-size:22px; line-height:2; color:#1565c0; margin:0 0 10px; font-family:"Noto Naskh Arabic","Amiri","Scheherazade New",serif; }
  
  .content-blue-quote { background:#fff; border:2.5px solid #1565c0; border-radius:18px; padding:14px 16px; margin:12px 0; font-size:15px; line-height:1.75; }

  .content-green-quote { background:#fff; border:2.5px solid #4caf50; border-radius:18px; padding:14px 16px; margin:12px 0; font-size:15px; line-height:1.75; }
  .content-src { display:block; margin-top:6px; font-size:12.5px; font-style:italic; opacity:.75; }
  .content-list { margin:0 0 12px; padding-left:1.4em; font-size:15px; line-height:1.72; }
  .content-list li { margin-bottom:5px; }
  .content-hr { border:0; border-top:1px solid var(--tg-theme-hint-color,#aaa); opacity:.4; margin:18px 0; }
  .content-img { width:100%; max-height:260px; object-fit:cover; border-radius:var(--radius); margin:10px 0; }
  mark { background:#ffe066; color:#000; border-radius:3px; padding:0 1px; }
  mark.cur { background:#ff9f1c; }
  .snippet { font-size:12.5px; line-height:1.5; color:var(--tg-theme-hint-color,#777); margin-top:6px; unicode-bidi:plaintext; overflow-wrap:anywhere; }
  #matchBar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom)); z-index:20; display:flex; align-items:center; gap:6px; background:var(--tg-theme-button-color,#2481cc); color:#fff; border-radius:999px; padding:6px 12px; box-shadow:0 3px 12px rgba(0,0,0,.3); font-size:14px; }
  #matchBar button { border:0; background:transparent; color:inherit; font-size:18px; padding:4px 10px; }
  #searchInput::-webkit-search-cancel-button, #searchInput::-webkit-search-decoration { -webkit-appearance:none; display:none; }
</style>
</head>
<body>
<div id="lessonList">
  <div class="topbar"><h1>📚 Masomo</h1><span id="count" class="count"></span></div>
  <div class="search-wrap">
    <input id="searchInput" type="search" placeholder="🔎 Tafuta somo..." autocomplete="off" />
    <button id="clearSearch" aria-label="Futa utafutaji">×</button>
  </div>
  <div id="categories" class="categories"></div>
  <div id="loadingMsg">Inapakia masomo...</div>
  <div id="listContainer"></div>
  <div id="emptyMsg" class="hidden">Hakuna somo lililopatikana.</div>
</div>

<div id="lessonView">
  <div class="reader-head"><h2 id="lessonTitle"></h2></div>
  <img id="lessonImage" src="" alt="Picha ya somo" />
  <div id="lessonMeta" class="reader-meta"></div>
  <div id="lessonContent"></div>
</div>

<div id="matchBar" class="hidden"><button id="prevM" aria-label="Iliyotangulia">▲</button><span id="matchInfo"></span><button id="nextM" aria-label="Inayofuata">▼</button></div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  tg.enableClosingConfirmation();

  const listContainer = document.getElementById("listContainer");
  const loadingMsg = document.getElementById("loadingMsg");
  const emptyMsg = document.getElementById("emptyMsg");
  const searchInput = document.getElementById("searchInput");
  const clearSearch = document.getElementById("clearSearch");
  const categoriesBox = document.getElementById("categories");
  const count = document.getElementById("count");
  let masomo = [];
  let categoryActive = "Zote";

  fetch("masomo.json")
    .then(r => { if (!r.ok) throw new Error("Imeshindwa kupakia masomo.json"); return r.json(); })
    .then(data => {
      masomo = Array.isArray(data) ? data : [];
      loadingMsg.classList.add("hidden");
      tengenezaCategories();
      choraOrodha();
      jengaIndex();
    })
    .catch(error => {
      loadingMsg.textContent = "Samahani, imeshindwa kupakia masomo. Jaribu tena baadaye.";
      console.error(error);
    });

  function tengenezaCategories() {
    const categories = ["Zote", ...new Set(masomo.map(s => s.category || "Mengineyo"))];
    categoriesBox.innerHTML = categories.map(cat => `<button class="cat-btn ${cat === categoryActive ? "active" : ""}" data-category="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`).join("");
    categoriesBox.querySelectorAll(".cat-btn").forEach(btn => btn.addEventListener("click", () => {
      categoryActive = btn.dataset.category;
      tengenezaCategories();
      choraOrodha();
    }));
  }

  // ===== Utafutaji wa kila kitu (kichwa, maelezo, Kiswahili, Kiarabu, ndani ya masomo yote) =====
  const MARKS = /[\u0300-\u036f\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g;
  const AR_FIX = { "ٱ":"ا", "ى":"ي", "ة":"ه" };
  function normChar(c) {
    return c.normalize("NFD").replace(MARKS, "").toLowerCase()
      .replace(/[’‘'`\-–—]/g, "").replace(/[ٱىة]/g, m => AR_FIX[m]);
  }
  // Inarudisha maandishi yaliyosafishwa + ramani ya nafasi kurudi kwenye maandishi halisi.
  // Pia: aa=a, ee=e, uu=u (Allaah=Allah, Jihaad=Jihad, Qur-aan=Quran).
  function normMap(t) {
    t = String(t == null ? "" : t); let out = ""; const map = [];
    for (let i = 0; i < t.length; i++) {
      for (const ch of normChar(t[i])) {
        if ("aeiou".includes(ch) && out.endsWith(ch)) continue;
        out += ch; for (let k = 0; k < ch.length; k++) map.push(i);
      }
    }
    return { out, map };
  }
  const norm = t => normMap(t).out;
  function queryWords() { return norm(searchInput.value).split(/\s+/).filter(Boolean); }

  function maandishiYote(v, acc = []) {
    if (typeof v === "string") { if (v.trim()) acc.push(v); }
    else if (Array.isArray(v)) v.forEach(x => maandishiYote(x, acc));
    else if (v && typeof v === "object") Object.values(v).forEach(x => maandishiYote(x, acc));
    return acc;
  }

  // Pakia maudhui ya kila somo nyuma ya pazia ili utafutaji uyaone
  let indexPending = 0;
  function jengaIndex() {
    masomo.forEach(somo => {
      if (!somo.file || somo._index) return;
      indexPending++;
      fetch(somo.file).then(r => r.ok ? r.json() : null).then(data => {
        if (!data) return;
        somo._segs = maandishiYote(data).map(t => ({ t, n: norm(t) }));
        somo._index = somo._segs.map(x => x.n).join(" \n ");
      }).catch(() => {}).finally(() => { indexPending--; if (searchInput.value.trim()) choraOrodha(); });
    });
  }

  // Weka alama ya njano kwenye maneno yaliyotafutwa ndani ya kipengele (root)
  function highlightIn(root, words) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      const text = node.nodeValue; const { out, map } = normMap(text);
      let ranges = [];
      words.forEach(w => {
        let i = out.indexOf(w);
        while (i !== -1) {
          let end = map[i + w.length - 1] + 1;
          while (end < text.length && normChar(text[end]) === "") end++;   // harakat za Kiarabu
          ranges.push([map[i], end]); i = out.indexOf(w, i + w.length);
        }
      });
      if (!ranges.length) return;
      ranges.sort((a, b) => a[0] - b[0]);
      const merged = [ranges[0].slice()];
      for (const r of ranges.slice(1)) { const l = merged[merged.length - 1]; if (r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push(r.slice()); }
      const frag = document.createDocumentFragment(); let pos = 0;
      merged.forEach(([s0, e0]) => {
        if (s0 > pos) frag.appendChild(document.createTextNode(text.slice(pos, s0)));
        const m = document.createElement("mark"); m.textContent = text.slice(s0, e0); frag.appendChild(m); pos = e0;
      });
      if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
      node.replaceWith(frag);
    });
  }

  // Kipande cha maandishi kinachoonyesha neno lilipopatikana
  function snippetFor(somo, words) {
    const segs = somo._segs || [];
    const seg = segs.find(x => words.every(w => x.n.includes(w))) || segs.find(x => words.some(w => x.n.includes(w)));
    if (!seg) return "";
    const { out, map } = normMap(seg.t);
    const w = words.find(w => out.includes(w)); const p = out.indexOf(w);
    const st = map[Math.max(0, p - 45)], en = map[Math.min(map.length - 1, p + 110)] + 1;
    return (st > 0 ? "… " : "") + seg.t.slice(st, en).trim() + (en < seg.t.length ? " …" : "");
  }

  function choraOrodha() {
    const words = queryWords();
    const filtered = masomo.filter(somo => {
      const category = somo.category || "Mengineyo";
      const matchesCategory = categoryActive === "Zote" || category === categoryActive;
      const haystack = norm(`${somo.title || ""} ${somo.subtitle || ""} ${typeof somo.content === "string" ? somo.content : ""} ${category}`) + " " + (somo._index || "");
      return matchesCategory && words.every(w => haystack.includes(w));
    });

    listContainer.innerHTML = "";
    count.textContent = `${filtered.length}/${masomo.length}`;
    emptyMsg.textContent = (words.length && indexPending > 0) ? "Inatafuta ndani ya masomo..." : "Hakuna somo lililopatikana.";
    emptyMsg.classList.toggle("hidden", filtered.length !== 0);

    filtered.forEach(somo => {
      const item = document.createElement("div");
      item.className = "lesson-item";
      item.innerHTML = `
        <img src="${escapeAttr(somo.image || "")}" alt="" loading="lazy" />
        <div class="info">
          <div class="title">${escapeHtml(somo.title || "Bila jina")}</div>
          <div class="subtitle">${escapeHtml(somo.subtitle || "")}</div>
          <span class="category-label">${escapeHtml(somo.category || "Mengineyo")}</span>
        </div><span class="arrow">›</span>`;
      if (words.length) {
        const sn = snippetFor(somo, words);
        if (sn) { const d = document.createElement("div"); d.className = "snippet"; d.dir = "auto"; d.textContent = sn; highlightIn(d, words); item.querySelector(".info").appendChild(d); }
      }
      item.addEventListener("click", () => funguaSomo(somo));
      listContainer.appendChild(item);
    });
  }

  // Upau wa kuruka kati ya maneno yaliyopatikana ndani ya somo
  let marks = [], curMark = -1;
  function onyeshaMatches() {
    const words = queryWords(); const bar = document.getElementById("matchBar");
    marks = []; curMark = -1;
    if (words.length) { highlightIn(document.getElementById("lessonContent"), words); marks = [...document.querySelectorAll("#lessonContent mark")]; }
    bar.classList.toggle("hidden", marks.length === 0);
    if (marks.length) ruka(0);
  }
  function ruka(i) {
    if (!marks.length) return;
    if (marks[curMark]) marks[curMark].classList.remove("cur");
    curMark = (i + marks.length) % marks.length;
    marks[curMark].classList.add("cur");
    marks[curMark].scrollIntoView({ block: "center", behavior: "smooth" });
    document.getElementById("matchInfo").textContent = `${curMark + 1}/${marks.length}`;
  }

  async function funguaSomo(somo) {
    document.getElementById("lessonImage").src = somo.image || "";
    document.getElementById("lessonTitle").textContent = somo.title || "";
    document.getElementById("lessonMeta").textContent = somo.subtitle || somo.category || "";
    document.getElementById("lessonContent").innerHTML = "<p class=\"content-body\">Inapakia...</p>";
    document.getElementById("lessonList").classList.add("hidden");
    document.getElementById("lessonView").style.display = "block";
    tg.BackButton.show();
    window.scrollTo(0, 0);

    let content = somo.content || "";
    if (!content && somo.file) {
      try {
        const res = await fetch(somo.file);
        if (!res.ok) throw new Error("Imeshindwa kupakia " + somo.file);
        const data = await res.json();
        content = (RENDERERS[data.type] || Array.isArray(data.blocks)) ? data : (data.content || "");
      } catch (error) {
        console.error(error);
        document.getElementById("lessonContent").innerHTML = "<p class=\"content-body\">Samahani, imeshindwa kupakia somo hili.</p>";
        return;
      }
    }
    const R = (content && typeof content === "object" && !Array.isArray(content))
      ? (RENDERERS[content.type] || (Array.isArray(content.blocks) ? RENDERERS.somo : null)) : null;
    document.getElementById("lessonImage").classList.toggle("hidden", !somo.image || !!(R && R.hideImage));
    document.getElementById("lessonView").className = (R && R.cls) || "";
    document.getElementById("lessonContent").innerHTML = R
      ? R.render(content)
      : (Array.isArray(content) ? pangaAya(content) : (content && typeof content === "object" ? pangaKitu(content) : pangaRangiYaContent(String(content || ""))));
    onyeshaMatches();
  }

  // ===== REJISTA YA WACHORAJI =====
  // Kila JSON ina "type". Aina mpya ukitaka: ongeza mstari mmoja hapa.
  //   render   = function inayopokea JSON na kurudisha HTML
  //   cls      = class ya ukurasa (hiari)
  //   hideImage= ficha picha ya juu (hiari)
  const RENDERERS = {
    sura:    { render: d => pangaSura(d),    cls: "quran-reader",   hideImage: true },  // Qur'ani (haibadiliki)
    hadiyth: { render: d => pangaHadiyth(d), cls: "hadiyth-reader" },
    somo:    { render: d => pangaBlocks(d) }                                            // somo la jumla
  };

  // Somo la jumla: { "type":"somo", "blocks":[ {...}, {...} ] }
  // Vipengele (t): h, p, quote, arabic, ayah, hadith, list, note, hr, img
  // Ndani ya maandishi: [[nyekundu]]  {{italiki}}  **nzito**
  function pangaBlocks(d) {
    const txt = b => b.text != null ? b.text : (b.maandishi != null ? b.maandishi : "");
    const src = b => (b.source || b.chanzo) ? `<span class="content-src">${escapeHtml(b.source || b.chanzo)}</span>` : "";
    const blocks = (d.blocks || []).map(b => {
      if (typeof b === "string") return `<p class="content-body">${alama(b)}</p>`;
      switch ((b.t || b.type || "p").toLowerCase()) {
        case "h": case "heading": case "kichwa":
          return `<p class="content-heading">${alama(txt(b))}</p>`;
        case "quote": case "nukuu":
          return `<p class="content-quote">${alama(txt(b))}${src(b)}</p>`;
        case "arabic": case "kiarabu":
          return `<p class="ayah-arabic">${escapeHtml(b.arabic || txt(b))}</p>`;
        case "ayah": case "aya":
          return `<div class="ayah-block">${b.sura ? `<div class="ayah-number">${escapeHtml(b.sura)}</div>` : ""}`
            + (b.arabic ? `<p class="ayah-arabic">${escapeHtml(b.arabic)}</p>` : "")
            + (txt(b) ? `<p class="tafsiri">${alama(txt(b))}</p>` : "") + `</div>`;
        case "hadith": case "hadiyth":
          return (b.arabic ? `<p class="ayah-arabic">${escapeHtml(b.arabic)}</p>` : "")
            + `<p class="content-quote hadith">${alama(txt(b))}${src(b)}</p>`;
        case "list": case "orodha": {
          const tag = b.ordered ? "ol" : "ul";
          return `<${tag} class="content-list">${(b.items || []).map(i => `<li>${alama(i)}</li>`).join("")}</${tag}>`;
        }
        case "qarabic":
          return `<div class="block-qarabic"><p class="qarabic-text">${escapeHtml(b.arabic || txt(b))}</p></div>`;
        case "marabic":
          return `<div class="block-marabic"><p class="marabic-text">${escapeHtml(b.arabic || txt(b))}</p></div>`;
        case "green_quote": case "nukuu_kijani":
          return `<div class="content-green-quote">${alama(txt(b))}</div>`;
        case "blue_quote": case "nukuu_buluu":
          return `<div class="content-blue-quote">${alama(txt(b))}</div>`;
        case "note": case "dokezo":
          return `<div class="content-note">${alama(txt(b))}</div>`;
        case "hr": return `<hr class="content-hr">`;
        case "img": case "picha":
          return `<img class="content-img" src="${escapeAttr(b.src || "")}" alt="">`;
        default: // aina isiyojulikana: onyesha maandishi kama aya ya kawaida
          return txt(b) ? `<p class="content-body">${alama(txt(b))}</p>` : "";
      }
    }).join("");
    return blocks;
  }

  function pangaSura(sura) {
    const pages = [...new Set((sura.content || []).map(ayah => ayah.page || 1))].sort((a,b) => a-b);
    const pageHtml = pages.map(page => {
      const ayat = sura.content.filter(ayah => (ayah.page || 1) === page);
      const title = page === pages[0] ? `
        <div class="quran-title-row">
          <div class="quran-title-sw">SURA YA ${escapeHtml(sura.name || "").toUpperCase()}</div>
          <div class="quran-title-ar">${escapeHtml(sura.arabic_name || "")}</div>
        </div>
        ${sura.intro ? `<p class="quran-intro">${escapeHtml(sura.intro)}</p>` : ""}` : "";
      return `<section class="quran-page">
        <div class="quran-page-header"><span>${escapeHtml(sura.surah_number || "")} - ${escapeHtml(sura.name || "")}</span><span>Juzuu ${escapeHtml(sura.juz || 1)}</span><span class="quran-page-number">${page}</span><span dir="rtl">الجزء ${escapeHtml(sura.juz || 1)}</span><span>${escapeHtml(sura.arabic_name || "")}</span></div>
        ${title}
        ${ayat.map(ayah => `<div class="quran-ayah-row">
          <div class="quran-translation" data-number="${escapeAttr(ayah.number ?? "")}">${escapeHtml(ayah.translation || "")}</div>
          <div class="quran-arabic-cell"><span class="quran-arabic-number">${escapeHtml(ayah.number ?? "")}</span><span class="quran-arabic-text">${escapeHtml(ayah.arabic || "")}</span></div>
        </div>`).join("")}
      </section>`;
    }).join("");
    return `<div class="quran-pages">${pageHtml}</div>`;
  }

  function pangaAya(ayahList) {
    return ayahList.map(ayah => `
      <div class="ayah-block">
        <div class="ayah-number">Aya ${ayah.number ?? ""}</div>
        <p class="ayah-arabic">${escapeHtml(ayah.arabic || "")}</p>
        <p class="ayah-translation">${escapeHtml(ayah.translation || "")}</p>
      </div>`).join("");
  }

  function rudiOrodhani() {
    document.getElementById("lessonView").style.display = "none";
    document.getElementById("matchBar").classList.add("hidden");
    document.getElementById("lessonList").classList.remove("hidden");
    tg.BackButton.hide();
    window.scrollTo(0, 0);
  }

  function pangaRangiYaContent(text) {
    return text.split("\n").map(mstari => {
      const s = mstari.trim();
      if (!s) return "";
      if (s.startsWith(">")) return `<p class="content-quote">${escapeHtml(s.substring(1).trim())}</p>`;
      const niHeading = s === s.toUpperCase() && /[A-Z]/.test(s);
      return niHeading ? `<p class="content-heading">${escapeHtml(s)}</p>` : `<p class="content-body">${escapeHtml(s)}</p>`;
    }).join("");
  }

  // Huonyesha maudhui yoyote yaliyo object/list/string (mfano fadhila.json)
  function pangaKitu(v, key = "") {
    if (v == null) return "";
    if (typeof v === "string") {
      if (key === "kwaarabu") return `<p class="ayah-arabic">${escapeHtml(v)}</p>`;
      if (key === "hadiyth") return `<p class="content-quote hadith">${escapeHtml(v)}</p>`;
      if (key === "maelezo_ya_wanachuoni") return `<p class="content-quote">${escapeHtml(v)}</p>`;
      if (key === "tafsiri") return `<p class="tafsiri">${escapeHtml(v)}</p>`;
      return pangaRangiYaContent(v);
    }
    if (Array.isArray(v)) return v.map(x => pangaKitu(x, key)).join("");
    if (typeof v === "object") {
      let html = "";
      if (v.kichwa) html += `<p class="content-heading">${escapeHtml(v.kichwa)}</p>`;
      if (v.sura && v.kwaarabu) html += `<div class="ayah-number">${escapeHtml(v.sura)}</div>`;
      for (const [k, val] of Object.entries(v)) {
        if (k === "kichwa" || k === "sura") continue;
        html += pangaKitu(val, k);
      }
      return html;
    }
    return `<p class="content-body">${escapeHtml(v)}</p>`;
  }

  // [[maandishi]] = nyekundu (aya), {{maandishi}} = italiki
  function alama(t) {
    return escapeHtml(t || "")
      .replace(/\[\[(.+?)\]\]/g, '<span class="aya-red">$1</span>')
      .replace(/\{\{(.+?)\}\}/g, '<i>$1</i>')
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  }

  function pangaHadiyth(d) {
    const head = `<div class="hd-head">
      <div class="ar">${escapeHtml(d.kitabu_ar || "")}</div><div class="sw">${escapeHtml(d.kitabu || "")}</div>
      <div class="ar">${escapeHtml(d.sura_ar || "")}</div><div class="sw">${escapeHtml(d.sura || "")}</div></div>`;
    const items = (d.hadiyth || []).map(h => `<div class="hd-item">
      ${[].concat(h.kwaarabu || []).map(a => `<p class="hd-ar">${alama(a)}</p>`).join("")}
      <p class="hd-sw"><span class="msimulizi">${escapeHtml(h.msimulizi || "")}</span> ${alama(h.tafsiri)}${h.chanzo ? ` <span class="chanzo">[${escapeHtml(h.chanzo)}]</span>` : ""}</p>
      ${[].concat(h.zaidi || []).map(z => `<p class="hd-sw">${alama(z)}</p>`).join("")}
      ${(h.ufafanuzi && h.ufafanuzi.length) ? `<p class="hd-ufa-title">UFAFANUZI</p>` + [].concat(h.ufafanuzi).map(u => `<p class="hd-ufa">${alama(u)}</p>`).join("") : ""}
    </div>`).join("");
    return head + items;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
  }
  function escapeAttr(value) { return escapeHtml(value); }

  searchInput.addEventListener("input", () => {
    clearSearch.style.display = searchInput.value ? "block" : "none";
    choraOrodha();
  });
  clearSearch.addEventListener("click", () => { searchInput.value = ""; clearSearch.style.display = "none"; choraOrodha(); searchInput.focus(); });
  document.getElementById("prevM").addEventListener("click", () => ruka(curMark - 1));
  document.getElementById("nextM").addEventListener("click", () => ruka(curMark + 1));
  tg.BackButton.onClick(rudiOrodhani);
</script>
</body>
</html>
